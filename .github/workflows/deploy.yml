name: Build & Deploy Backend to EC2

on:
    push:
        branches:
            - production
    workflow_dispatch:

env:
    REGISTRY: docker.io
    IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/unisole-engine

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push Docker image (Backend Only)
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                  cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
                  cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

    deploy-to-ec2:
        needs: build-and-push
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy to EC2
              env:
                  AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
                  AWS_EC2_USER: ${{ secrets.AWS_EC2_USER }}
                  AWS_EC2_KEY: ${{ secrets.AWS_EC2_KEY }}
                  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
                  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$AWS_EC2_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -H $AWS_EC2_HOST >> ~/.ssh/known_hosts

                  ssh -i ~/.ssh/id_rsa $AWS_EC2_USER@$AWS_EC2_HOST << 'EOF'
                    set -e
                    cd $HOME/unisole-prod
                    git fetch origin production
                    git reset --hard HEAD
                    git checkout -B production origin/production
                    git reset --hard origin/production
                    echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
                    if docker image inspect "$DOCKER_USERNAME/unisole-engine:latest" >/dev/null 2>&1; then
                      docker tag "$DOCKER_USERNAME/unisole-engine:latest" "$DOCKER_USERNAME/unisole-engine:rollback-pre-merge"
                    fi
                    docker compose -f docker-compose.prod.yml pull
                    docker compose -f docker-compose.prod.yml up -d --remove-orphans

                    API_CONTAINER=$(docker compose -f docker-compose.prod.yml ps -q api)
                    HEALTHY=0
                    for i in $(seq 1 30); do
                      STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$API_CONTAINER" 2>/dev/null || echo "starting")
                      if [ "$STATUS" = "healthy" ]; then
                        HEALTHY=1
                        break
                      fi
                      sleep 3
                    done
                    if [ "$HEALTHY" -ne 1 ]; then
                      echo "API container failed to become healthy within 90s:"
                      docker compose -f docker-compose.prod.yml logs --tail=80 api
                      exit 1
                    fi

                    docker compose -f docker-compose.prod.yml exec -T api npm run db:migrate
                    docker compose -f docker-compose.prod.yml exec -T api npm run db:seed:system
                    docker compose -f docker-compose.prod.yml logs --tail=50
                  EOF

            - name: Notify Deployment Success
              run: echo "✅ Backend API deployment to EC2 completed successfully"
