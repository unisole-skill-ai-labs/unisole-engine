services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unisole
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unisole"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - unisole-network

  # Backend API
  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/unisole
      JWT_SECRET: ${JWT_SECRET:-unisole-secret-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-unisole-refresh-secret-key}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-unisole_webhook_secret_2026}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - unisole-network

  # Admin Dashboard
  admin:
    build:
      context: ../unisole-admin
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3000}
    depends_on:
      - api
    networks:
      - unisole-network

  # Main LMS Application
  lms:
    build:
      context: ../unisole-lms
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "5174:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3000}
    depends_on:
      - api
    networks:
      - unisole-network

  # SEO Website
  seo:
    build:
      context: ../unisole-seo
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "5175:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3000}
    networks:
      - unisole-network

volumes:
  pgdata:
    driver: local

networks:
  unisole-network:
    driver: bridge
