services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unisole
    volumes:
      - pgdata:/var/lib/postgresql
      - ./edtech_schema_and_seed.sql:/docker-entrypoint-initdb.d/01_schema_and_seed.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unisole"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/unisole
      JWT_SECRET: unisole-secret-key
      JWT_REFRESH_SECRET: unisole-refresh-secret-key
      RAZORPAY_KEY_SECRET: rzp_test_secret
      RAZORPAY_WEBHOOK_SECRET: unisole_webhook_secret_2026
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
