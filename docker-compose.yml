services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unisole
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unisole"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/unisole
      # Set to "true" to wipe & re-insert seed data on startup. Keep "false" to preserve data.
      RUN_SEED: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "node dist/scripts/migrate.js &&
             if [ \"$$RUN_SEED\" = \"true\" ]; then node dist/scripts/seed.js; fi &&
             node dist/index.js"

volumes:
  pgdata:
