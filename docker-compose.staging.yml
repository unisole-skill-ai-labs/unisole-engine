# ============================================================
# Staging Compose: Backend API + Database only
# Frontends (Admin, LMS, SEO) are deployed on Vercel separately
# ============================================================

services:
  # Staging PostgreSQL Database (Port 5434)
  db-staging:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-unisole_staging}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-unisole_staging}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - unisole-staging-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Staging Backend API (Port 3001)
  api-staging:
    build:
      context: .
    restart: always
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db-staging:5432/${DB_NAME:-unisole_staging}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY}
      FAST2SMS_WHATSAPP_MESSAGE_ID: ${FAST2SMS_WHATSAPP_MESSAGE_ID}
      FAST2SMS_SENDER_ID: ${FAST2SMS_SENDER_ID}
      OTP_PROVIDER: ${OTP_PROVIDER}
      DEFAULT_OTP: ${DEFAULT_OTP}
      NODE_ENV: staging
      VIDEO_STORAGE_MODE: ${VIDEO_STORAGE_MODE:-stub}
      VIDEO_UPLOAD_MODE: ${VIDEO_UPLOAD_MODE:-hls}
      VIDEO_MAX_SIZE_MB: ${VIDEO_MAX_SIZE_MB:-500}
      VIDEO_PLAY_TTL_SECONDS: ${VIDEO_PLAY_TTL_SECONDS:-21600}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-}
      AZURE_HLS_CONTAINER: ${AZURE_HLS_CONTAINER:-hls}
      AZURE_STORAGE_ENDPOINT: ${AZURE_STORAGE_ENDPOINT:-}
    ports:
      - "3001:3001"
    depends_on:
      db-staging:
        condition: service_healthy
    networks:
      - unisole-staging-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata_staging:
    driver: local

networks:
  unisole-staging-network:
    driver: bridge
