# ============================================================
# Staging Compose: Backend API + Database only
# Frontends (Admin, LMS, SEO) are deployed on Vercel separately
# ============================================================

services:
  # Staging PostgreSQL Database (Port 5434)
  db-staging:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-unisole_staging}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-unisole_staging}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - unisole-staging-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Staging Backend API (Port 3001)
  api-staging:
    build:
      context: .
    restart: always
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db-staging:5432/${DB_NAME:-unisole_staging}
      JWT_SECRET: ${JWT_SECRET:-unisole-staging-secret-key-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-unisole-staging-refresh-secret-key-2026}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_secret_staging}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-unisole_webhook_staging_2026}
      NODE_ENV: staging
    ports:
      - "3001:3001"
    depends_on:
      db-staging:
        condition: service_healthy
    networks:
      - unisole-staging-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata_staging:
    driver: local

networks:
  unisole-staging-network:
    driver: bridge
