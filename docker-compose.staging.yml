services:
  # Staging PostgreSQL Database (Port 5434)
  db-staging:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unisole_staging
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unisole_staging"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - unisole-staging-network

  # Staging Backend API (Port 3001)
  api-staging:
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@db-staging:5432/unisole_staging
      JWT_SECRET: ${JWT_SECRET:-unisole-staging-secret-key-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-unisole-staging-refresh-secret-key-2026}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_secret_staging}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-unisole_webhook_staging_2026}
      NODE_ENV: staging
    ports:
      - "3001:3001"
    depends_on:
      db-staging:
        condition: service_healthy
    networks:
      - unisole-staging-network

  # Staging Admin Dashboard (Port 5183)
  admin-staging:
    build:
      context: ../unisole-admin
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "5183:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3001}
    depends_on:
      - api-staging
    networks:
      - unisole-staging-network

  # Staging Main LMS Application (Port 5184)
  lms-staging:
    build:
      context: ../unisole-lms
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "5184:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3001}
    depends_on:
      - api-staging
    networks:
      - unisole-staging-network

  # Staging SEO Website (Port 5185)
  seo-staging:
    build:
      context: ../unisole-seo
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "5185:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3001}
    networks:
      - unisole-staging-network

volumes:
  pgdata_staging:
    driver: local

networks:
  unisole-staging-network:
    driver: bridge
