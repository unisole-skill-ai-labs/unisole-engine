# Production Compose: Backend API + Database + Nginx only
# Frontends (Admin, LMS, SEO) are deployed on Vercel separately

services:
  # PostgreSQL Database (Internal only)
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-unisole}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./edtech_schema_and_seed.sql:/docker-entrypoint-initdb.d/01_schema_and_seed.sql:ro
      - ./backups:/backups
    ports:
      - "5432:5432" # Internal only, not exposed to internet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-unisole}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unisole-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API (Internal port 3000, exposed via Nginx)
  api:
    image: ${DOCKER_USERNAME:-unisole}/unisole-engine:latest
    restart: always
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-unisole}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3000:3000" # Internal only, not exposed to internet
    depends_on:
      db:
        condition: service_healthy
    networks:
      - unisole-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy (Exposed to internet via api.yourdomain.com)
  # Handles SSL, security headers, rate limiting for API
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80" # HTTP redirect to HTTPS
      - "443:443" # HTTPS for api.yourdomain.com
    volumes:
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - unisole-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    driver: local

networks:
  unisole-network:
    driver: bridge
