# Production Compose: Backend API + Database + Nginx only
# Frontends (Admin, LMS, SEO) are deployed on Vercel separately

services:
  # PostgreSQL Database (Internal only)
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-unisole}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432" # Internal only, not exposed to internet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-unisole}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unisole-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API (Internal port 3000, exposed via Nginx)
  api:
    image: ${DOCKER_USERNAME:-unisole}/unisole-engine:latest
    restart: always
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-unisole}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY}
      FAST2SMS_WHATSAPP_MESSAGE_ID: ${FAST2SMS_WHATSAPP_MESSAGE_ID}
      FAST2SMS_SENDER_ID: ${FAST2SMS_SENDER_ID}
      OTP_PROVIDER: ${OTP_PROVIDER:-FAST2SMS}
      NODE_ENV: ${NODE_ENV:-production}
      STORAGE_STRICT: ${STORAGE_STRICT:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      CLIENT_URL: ${CLIENT_URL:-}
      SEO_URL: ${SEO_URL:-}
      # Google Drive file storage (use a dedicated production GDRIVE_ROOT_FOLDER_ID; never use it for staging or E2E tests)
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN:-}
      GDRIVE_ROOT_FOLDER_ID: ${GDRIVE_ROOT_FOLDER_ID:-}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-}
      AZURE_HLS_CONTAINER: ${AZURE_HLS_CONTAINER:-hls}
      AZURE_STORAGE_ENDPOINT: ${AZURE_STORAGE_ENDPOINT:-}
      VIDEO_STORAGE_MODE: ${VIDEO_STORAGE_MODE:-stub}
      VIDEO_UPLOAD_MODE: ${VIDEO_UPLOAD_MODE:-hls}
      VIDEO_MAX_SIZE_MB: ${VIDEO_MAX_SIZE_MB:-500}
      VIDEO_PLAY_TTL_SECONDS: ${VIDEO_PLAY_TTL_SECONDS:-21600}
    ports:
      - "3000:3000" # Internal only, not exposed to internet
    depends_on:
      db:
        condition: service_healthy
    networks:
      - unisole-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy (Exposed to internet via api.yourdomain.com)
  # Handles SSL, security headers, rate limiting for API
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80" # HTTP redirect to HTTPS
      - "443:443" # HTTPS for api.yourdomain.com
    volumes:
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - unisole-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    driver: local

networks:
  unisole-network:
    driver: bridge
