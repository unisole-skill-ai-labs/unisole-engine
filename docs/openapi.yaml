components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: UUID of the resource
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Missing required field or no valid fields provided
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Missing required field: title"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Not found"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    User:
      type: object
      required: [id, name, email, role, auth_provider, is_verified, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, maxLength: 15, nullable: true }
        password_hash: { type: string, maxLength: 255, nullable: true }
        role: { $ref: "#/components/schemas/UserRole" }
        auth_provider: { $ref: "#/components/schemas/AuthProvider" }
        is_verified: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserInput:
      type: object
      description: Writable user fields (create requires name and email)
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, maxLength: 15, nullable: true }
        password_hash: { type: string, maxLength: 255, nullable: true }
        role: { $ref: "#/components/schemas/UserRole" }
        auth_provider: { $ref: "#/components/schemas/AuthProvider" }
        is_verified: { type: boolean }

    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }

    CategoryInput:
      type: object
      description: Writable category fields (create requires name)
      properties:
        name: { type: string, maxLength: 100 }

    Course:
      type: object
      required: [id, title, slug, price, rating_avg, total_enrollments, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        slug: { type: string, maxLength: 220 }
        category_id: { type: string, format: uuid, nullable: true }
        price: { type: string, example: "49.99" }
        rating_avg: { type: string, example: "4.50" }
        total_enrollments: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CourseInput:
      type: object
      description: Writable course fields (create requires title and slug)
      properties:
        title: { type: string, maxLength: 200 }
        slug: { type: string, maxLength: 220 }
        category_id: { type: string, format: uuid, nullable: true }
        price: { type: string, example: "49.99" }
        rating_avg: { type: string, example: "4.50" }
        total_enrollments: { type: integer }

    Module:
      type: object
      required: [id, title, order_index]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        course_id: { type: string, format: uuid, nullable: true }
        order_index: { type: integer, example: 0 }

    ModuleInput:
      type: object
      description: Writable module fields (create requires title)
      properties:
        title: { type: string, maxLength: 200 }
        course_id: { type: string, format: uuid, nullable: true }
        order_index: { type: integer, example: 0 }

    ModuleWithLessons:
      type: object
      required: [id, title, order_index, lessons]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        course_id: { type: string, format: uuid, nullable: true }
        order_index: { type: integer, example: 0 }
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/ModuleItem"

    CourseTree:
      allOf:
        - $ref: "#/components/schemas/Course"
        - type: object
          required: [modules]
          properties:
            modules:
              type: array
              items:
                $ref: "#/components/schemas/ModuleWithLessons"

    ModuleItem:
      type: object
      required: [id, title, type, order_index]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        type: { $ref: "#/components/schemas/ItemType" }
        content_url: { type: string, maxLength: 500, nullable: true }
        order_index: { type: integer, example: 0 }

    ModuleItemInput:
      type: object
      description: Writable module item fields (create requires title and type)
      properties:
        title: { type: string, maxLength: 200 }
        type: { $ref: "#/components/schemas/ItemType" }
        content_url: { type: string, maxLength: 500, nullable: true }
        order_index: { type: integer, example: 0 }

    ModuleLesson:
      type: object
      required: [id, module_id, module_item_id, order_index]
      properties:
        id: { type: string, format: uuid }
        module_id: { type: string, format: uuid }
        module_item_id: { type: string, format: uuid }
        order_index: { type: integer, example: 0 }

    ModuleLessonInput:
      type: object
      description: Writable module lesson fields (create requires module_id and module_item_id)
      properties:
        module_id: { type: string, format: uuid }
        module_item_id: { type: string, format: uuid }
        order_index: { type: integer, example: 0 }

    Assignment:
      type: object
      required: [id, title, max_score, allowed_attempts]
      properties:
        id: { type: string, format: uuid }
        lesson_id: { type: string, format: uuid, nullable: true }
        title: { type: string, maxLength: 200 }
        max_score: { type: integer, example: 100 }
        due_date: { type: string, format: date-time, nullable: true }
