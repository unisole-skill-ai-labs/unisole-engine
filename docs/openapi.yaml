openapi: 3.0.3
info:
  title: Unisole Engine API
  version: 1.0.0
  description: |
    REST API for the Unisole LMS. Express + Drizzle (PostgreSQL).

    - Base path for all resources: `/api`
    - Create returns `201`, delete returns `204` (no body)
    - Errors return `{ "error": "<message>" }` with 400/404/500
  contact:
    name: Unisole
servers:
  - url: http://localhost:3000
    description: Local development
  - url: http://<ec2-public-ip>:3000
    description: EC2 deployment

tags:
  - name: Health
    description: Service health check
  - name: Users
    description: User accounts
  - name: Categories
    description: Course categories
  - name: Courses
    description: Courses with modules and tree
  - name: Modules
    description: Course modules and their lessons
  - name: Module Items
    description: Content items (video, pdf, article, quiz, assignment)
  - name: Module Lessons
    description: Links a module to a content item
  - name: Assignments
    description: Assignments attached to content items
  - name: Assignment Submissions
    description: Student submissions for assignments
  - name: Quizzes
    description: Quizzes attached to content items
  - name: Tests
    description: Standalone tests and their attempts
  - name: Questions
    description: Quiz questions
  - name: Test Attempts
    description: User attempts at a test
  - name: Carts
    description: Per-user shopping carts
  - name: Coupons
    description: Discount coupons
  - name: Enrollments
    description: Course enrollments
  - name: Orders
    description: Orders and payments
  - name: Order Items
    description: Courses purchased within an order
  - name: Payments
    description: Payment records
  - name: Certificates
    description: Completion certificates
  - name: Reviews
    description: Course reviews

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/users:
    get:
      tags: [Users]
      summary: List all users
      operationId: listUsers
      responses:
        "200":
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      tags: [Users]
      summary: Create a user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/UserInput"
              required: [name, email]
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"

